<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App updates</title>
    <meta
      name="description"
      content="Latest Android builds for DIYfolio, Hannah's Paints, Mileage Tracker, and Auction Tracker."
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="mast">
      <p class="kicker">Lefor family apps</p>
      <h1>App updates</h1>
      <p class="lede">
        Public downloads for private Android apps. Each app publishes its current build at
        <code>/&lt;app&gt;/latest.json</code>.
      </p>
    </header>
    <main>
      <div id="apps" class="apps" aria-live="polite">
        <p class="empty">Loading apps…</p>
      </div>
    </main>
    <footer>
      <p>
        APKs are GitHub Release assets. Android may ask you to allow installs from the browser.
      </p>
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
